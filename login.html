<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iniciar sesión | Colegio Valle Central</title><style>:root{--navy:#102a43;--blue:#1672ad;--sky:#eaf5fb;--yellow:#f4c95d;--muted:#647482;--line:#d5e2ea}*{box-sizing:border-box}body{margin:0;background:var(--sky);color:#182733;font:16px Arial,sans-serif}.wrap{max-width:520px;width:calc(100% - 32px);margin:auto}.top{background:var(--navy);color:#fff;padding:18px 0}.top a{color:#fff;text-decoration:none}.card{background:#fff;margin:70px auto;padding:32px;border:1px solid var(--line);box-shadow:0 16px 40px #102a4320}.eyebrow{color:var(--blue);font-size:12px;font-weight:bold;letter-spacing:2px;text-transform:uppercase}.card h1{color:var(--navy);font-size:34px;margin:12px 0}.card p{color:var(--muted);line-height:1.6}label{display:grid;gap:7px;color:var(--muted);font-weight:bold;font-size:13px;margin:18px 0}input{border:1px solid var(--line);padding:13px;border-radius:4px;font:inherit}.btn{width:100%;border:0;border-radius:4px;background:var(--blue);color:#fff;padding:13px;font-weight:bold;cursor:pointer;font-size:15px}.message{display:none;padding:12px;background:#fde9d9;color:#93451f;margin-top:15px;font-size:13px}</style></head>
<body><header class="top"><div class="wrap"><a href="index.html">← Volver al registro</a></div></header><main class="wrap"><section class="card"><div class="eyebrow">Acceso institucional</div><h1>Iniciar sesión</h1><p>Ingresa con el correo y la contraseña que registraste. Luego verás tu información docente.</p><form id="login-form"><label>Correo institucional<input id="email" type="email" placeholder="nombre@vallecentral.edu" required></label><label>Contraseña<input id="password" type="password" placeholder="Tu contraseña" required></label><button class="btn" type="submit">Iniciar sesión</button><div class="message" id="message"></div></form></section></main><script>const registration=JSON.parse(sessionStorage.getItem('teacherRegistration')||'null');document.getElementById('login-form').addEventListener('submit',event=>{event.preventDefault();const message=document.getElementById('message');if(!registration){message.textContent='No hay un registro en esta sesión. Regresa al registro docente.';message.style.display='block';return}if(document.getElementById('email').value!==registration.email||document.getElementById('password').value!==registration.password){message.textContent='El correo o la contraseña no coinciden.';message.style.display='block';return}window.location.href='perfil.html'});</script></body></html>
