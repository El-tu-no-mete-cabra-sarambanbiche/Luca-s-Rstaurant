<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi perfil docente | Colegio Valle Central</title><style>:root{--navy:#102a43;--blue:#1672ad;--sky:#eaf5fb;--yellow:#f4c95d;--muted:#647482;--line:#d5e2ea}*{box-sizing:border-box}body{margin:0;background:var(--sky);color:#182733;font:16px Arial,sans-serif}.wrap{max-width:850px;width:calc(100% - 32px);margin:auto}.top{background:var(--navy);color:#fff;padding:18px 0}.top .wrap{display:flex;justify-content:space-between}.top a{color:#fff;text-decoration:none}.card{background:#fff;margin:55px auto;padding:35px;border:1px solid var(--line);box-shadow:0 16px 40px #102a4320}.eyebrow{color:var(--blue);font-size:12px;font-weight:bold;letter-spacing:2px;text-transform:uppercase}.profile{display:flex;align-items:center;gap:18px;border-bottom:1px solid var(--line);padding-bottom:24px}.avatar{width:70px;height:70px;border-radius:50%;background:var(--yellow);color:var(--navy);display:grid;place-items:center;font-size:23px;font-weight:bold}.profile h1{color:var(--navy);font-size:34px;margin:8px 0}.muted{color:var(--muted);line-height:1.6}.data{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:25px}.item{border:1px solid var(--line);padding:18px}.item b{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;margin-bottom:7px}.item span{font-size:17px}.btn{display:inline-block;margin-top:25px;background:var(--blue);color:#fff;text-decoration:none;padding:13px 17px;border-radius:4px;font-weight:bold}.empty{color:#a84b2b}@media(max-width:560px){.profile{align-items:flex-start;flex-direction:column}.data{grid-template-columns:1fr}}
</style></head>
<body><header class="top"><div class="wrap"><a href="index.html">← Portal escolar</a><a href="https://www.mep.go.cr/" target="_blank" rel="noopener">Portal oficial MEP ↗</a></div></header><main class="wrap"><section class="card"><div id="profile-content"></div></section></main><script>const data=JSON.parse(sessionStorage.getItem('teacherRegistration')||'null');const content=document.getElementById('profile-content');if(!data){content.innerHTML='<p class="empty">No se encontró un registro en esta sesión. Regresa al portal y completa el registro docente.</p><a class="btn" href="index.html#acceso">Ir al registro</a>'}else{const initials=data.name.split(' ').map(word=>word[0]).slice(0,2).join('').toUpperCase();content.innerHTML='<div class="profile"><div class="avatar">'+initials+'</div><div><div class="eyebrow">Perfil docente</div><h1>'+data.name+'</h1><div class="muted">Registro institucional completado</div></div></div><div class="data"><div class="item"><b>Materia</b><span>'+data.subject+'</span></div><div class="item"><b>Correo institucional</b><span>'+data.email+'</span></div><div class="item"><b>Teléfono</b><span>'+data.phone+'</span></div><div class="item"><b>Estado</b><span>Registro activo</span></div></div><p class="muted">Esta información proviene del registro realizado en esta sesión. Los datos oficiales del MEP deben consultarse en su portal autorizado.</p><a class="btn" href="https://www.mep.go.cr/" target="_blank" rel="noopener">Continuar al portal oficial MEP ↗</a>'}</script></body></html>
